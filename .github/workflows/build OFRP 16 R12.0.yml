name: OFRP 16.0 Builder

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE_URL:
        description: "Device tree url"
        required: true
        default: "https://github.com/adontoo/device_xiaomi_sm8750_OFRP"
      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "fox_14.1"
      DEVICE_PATH:
        description: "Device path device/"
        required: true
        default: "xiaomi/sm8750_thales"
      DEVICE_NAME:
        description: "Device name"
        required: true
        default: "sm8750_thales"
      LUNCH_TARGET:
        description: "lunch twrp_ (default same as device name)"
        required: false
        default: ""
      BUILD_PARTITION:
        description: "Build partition (recovery / vendor_boot / boot)"
        required: true
        default: "recovery"
      APPLY_LEGACY_PATCHES:
        description: "Apply adontoo 14.1 patches (bionic / libmicrohttpd)"
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Show build info
        run: |
          if [ -n "${{ github.event.inputs.LUNCH_TARGET }}" ]; then
            echo "LUNCH_TARGET=${{ github.event.inputs.LUNCH_TARGET }}" >> "$GITHUB_ENV"
          else
            echo "LUNCH_TARGET=${{ github.event.inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"
          fi
          {
            echo 'BUILD_INFO<<EOF'
            echo
            echo "Manifest: OrangeFox fox_16.0 (R12.0)"
            echo "Device tree url: ${{ github.event.inputs.DEVICE_TREE_URL }}"
            echo "Device tree branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
            echo "Device path: ${{ github.event.inputs.DEVICE_PATH }}"
            echo "Device name: ${{ github.event.inputs.DEVICE_NAME }}"
            echo "Lunch target: ${{ github.event.inputs.LUNCH_TARGET }}"
            echo "Build target: ${{ github.event.inputs.BUILD_PARTITION }}.img"
            echo "Build date: $(date)"
            echo
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +%F)" >> "$GITHUB_ENV"

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Maximize build space
        uses: easimon/maximize-build-space@master

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true

      - name: Setup environment and swap
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update
          sudo apt install -y repo zram-tools
          sudo apt install -y "linux-modules-extra-$(uname -r)" || true
          if sudo modprobe zram 2>/dev/null; then
            sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
            sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
            sudo systemctl restart zramswap
            zramctl
          else
            echo "zram module unavailable on $(uname -r), creating 16G swapfile..."
            sudo fallocate -l 16G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          swapon --show
          free -h
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Sync OFRP 16.0 manifest
        run: |
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0
          (while true; do echo "$(date +%T) Syncing OFRP 16.0 source..."; sleep 60; done) &
          TIP_PID=$!
          trap "kill $TIP_PID 2>/dev/null || true" EXIT
          repo sync -c -j$(nproc --all) --no-clone-bundle --no-tags

      - name: Setup device
        run: |
          rm -rf "device/${{ github.event.inputs.DEVICE_PATH }}"
          git clone "${{ github.event.inputs.DEVICE_TREE_URL }}" -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" "device/${{ github.event.inputs.DEVICE_PATH }}"

      - name: Apply legacy 14.1 patches (optional)
        if: github.event.inputs.APPLY_LEGACY_PATCHES == 'true'
        run: |
          WORKINGDIR=$(pwd)
          if compgen -G "$WORKINGDIR/device/${{ github.event.inputs.DEVICE_PATH }}/patches/*.patch" > /dev/null; then
            cd "$WORKINGDIR/bootable/recovery"
            for p in "$WORKINGDIR/device/${{ github.event.inputs.DEVICE_PATH }}/patches/"*.patch; do
              echo "Applying $p..."
              git apply --reject --whitespace=fix "$p" || true
            done
            find . -name "*.rej" -print -exec cat {} +
            find . -name "*.rej" -delete
            cd "$WORKINGDIR"
          fi
          rm -rf external/libmicrohttpd
          git clone https://github.com/adontoo/android_external_libmicrohttpd -b ofox-14.1 external/libmicrohttpd
          rm -rf bionic
          git clone https://github.com/adontoo/OrangeFox-android_platform_bionic bionic

      - name: Generate build info
        run: |
          echo -e "$BUILD_INFO" >> INFO.txt
          echo "Change log:" >> INFO.txt
          set +e
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
          if [ $? -eq 0 ]; then
            git log "$LAST_TAG"..HEAD --pretty=format:"- %h-%an: %s" >> INFO.txt
          else
            git log -n 20 --pretty=format:"- %h-%an: %s" >> INFO.txt
          fi
          cat INFO.txt
        working-directory: device/${{ github.event.inputs.DEVICE_PATH }}

      - name: Build OFRP 16.0
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CCACHE_EXEC=$(command -v ccache)
          export CCACHE_MAXSIZE=5G
          export USE_CCACHE=1
          lunch "twrp_${{ env.LUNCH_TARGET }}-eng"
          (while true; do echo "$(date +%T) Building OFRP 16.0..."; free -h; sleep 60; done) &
          TIP_PID=$!
          trap "kill $TIP_PID 2>/dev/null || true" EXIT
          mka adbd "${{ github.event.inputs.BUILD_PARTITION }}image"
          OUT_DIR="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
          mv "$OUT_DIR/${{ github.event.inputs.BUILD_PARTITION }}.img" "$OUT_DIR/OrangeFox-R12.0-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.img"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox-R12.0-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.img
            out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox-*.zip
          name: OrangeFox-R12.0-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
          tag_name: ${{ env.BUILD_DATE }}-${{ github.run_id }}
          body_path: device/${{ github.event.inputs.DEVICE_PATH }}/INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
